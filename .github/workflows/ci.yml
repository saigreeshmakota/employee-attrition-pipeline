name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn pandera pytest ruff
      - name: Lint
        run: ruff check backend tests --select E4,E7,E9
      - name: Test deterministic portfolio checks
        run: pytest -q tests/test_portfolio_quality.py
